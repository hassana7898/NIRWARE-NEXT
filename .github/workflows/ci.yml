name: NIRWARE NEXT CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Clean Reproducible CI Matrix (Typecheck, Build & Verification)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: nirware_next
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Clean Monorepo Dependency Installation (npm ci)
        run: npm ci

      - name: 4. Static Typecheck (API + Web + Mobile)
        run: npm run typecheck

      - name: 5. Full Monorepo Production Build (Packages + API + Web Bundle)
        run: npm run build

      - name: 6. Prepare Dedicated Isolated Test Database
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE nirware_next_test;"
          npm run db:migrate
        env:
          PGPASSWORD: postgres123
          DATABASE_URL: postgres://postgres:postgres123@localhost:5432/nirware_next_test

      - name: 7. Apply Test Fixtures
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres123@localhost:5432/nirware_next_test
          ALLOW_PRODUCTION_SEED: 'true'

      - name: 8. Run 22-Suite Comprehensive Verification Matrix
        run: node tests/runner.js
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres123@localhost:5432/nirware_next
          TEST_DATABASE_URL: postgres://postgres:postgres123@localhost:5432/nirware_next_test
