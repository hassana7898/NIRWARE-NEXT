services:
  postgres:
    image: postgres:18-alpine
    container_name: nirware-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: nirware_next
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nirware_next"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nirware-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres123@postgres:5432/nirware_next
      JWT_SECRET: production_super_secret_jwt_key_at_least_32_chars
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nirware-web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
